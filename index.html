<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attar</title>
    <style>
      /* Fill the window and center the game canvas; Phaser does the scaling */
      /* overflow hidden: the page must never scroll; the canvas is display:block so it adds no stray line gap */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1210; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
