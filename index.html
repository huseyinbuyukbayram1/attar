<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attar</title>
    <style>
      /* Logo font of the title screen (SIL Open Font License, see public/assets/fonts/OFL.txt) */
      @font-face {
        font-family: 'Cinzel Decorative';
        src: url('/assets/fonts/CinzelDecorative-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: block;
      }
      /* Fill the window and center the game canvas; Phaser does the scaling */
      /* overflow hidden: the page must never scroll; the canvas is display:block so it adds no stray line gap */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1210; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      /* Shown while the game's own code downloads, so the page is never blank; BootScene removes it */
      #boot-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f3e2b3; font: 40px Georgia, serif; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
